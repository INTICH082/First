<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>First — Профиль</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="../Visual/profile.css">
    <base target="_blank">
</head>
<body>
    <aside id="left_sidebar">
        <div id="upper_logo">
            <div id="logo_text">FIRST<span>.</span></div>
        </div>
        <nav id="left_nav">
            <ul>
                <li><i class="fas fa-server"></i><a href="/main">Сервера</a></li>
                <li><i class="fas fa-wand-magic-sparkles"></i><a href="#">Скинченджер</a></li>
                <li><i class="fas fa-shield-halved"></i><a href="#">Клан</a></li>
                <li><i class="fas fa-users"></i><a href="#">Друзья</a></li>
                <li><i class="fas fa-gift"></i><a href="#">Кейсы</a></li>
                <li><i class="fas fa-store"></i><a href="#">Магазин</a></li>
                <li><i class="fas fa-trophy"></i><a href="#">Рейтинг</a></li>
            </ul>
        </nav>
        <div id="left_sidebar_bottom">
            <a href="#" id="settings_link"><i class="fas fa-cog"></i> Настройки</a>
            <div id="left_sidebar_user">
                <img id="left_sidebar_user_avatar" src="" alt="Аватар">
                <div id="left_sidebar_user_info">
                    <span id="left_sidebar_user_nickname">—</span>
                    <span id="left_sidebar_user_level">—</span>
                </div>
            </div>
        </div>
    </aside>

    <div id="main_content">
        <header id="upper_panel">
            <div id="upper_panel_left">
                <span id="page_title">Профиль</span>
            </div>
            <div id="upper_panel_right">
                <div id="online_counter">
                    <span id="online_dot"></span>
                    <span id="online">—</span>
                    <span>онлайн</span>
                    <div id="online_breakdown">
                        <div class="breakdown-row" data-game="cs2"><span>CS2</span><span class="count">—</span></div>
                        <div class="breakdown-row" data-game="csgo"><span>CS:GO</span><span class="count">—</span></div>
                        <div class="breakdown-row" data-game="cssource"><span>CS:Source</span><span class="count">—</span></div>
                        <div class="breakdown-row" data-game="cs16"><span>CS 1.6</span><span class="count">—</span></div>
                    </div>
                </div>
                <button id="chat_btn"><i class="fas fa-comment-dots"></i><span id="chat_badge"></span></button>
                <div id="notification_wrap"><i class="fas fa-bell"></i><span id="notification"></span></div>
                <div id="balance_wrap" style="display:none;"><i class="fas fa-gem"></i><span id="balance">0 ₽</span></div>
                <button id="steam_auth"><i class="fab fa-steam"></i><span>Войти через Steam</span></button>
                <div id="profile_header_btn" style="display:none;">
                    <img id="profile_header_avatar" src="" alt="">
                    <div id="profile_header_info">
                        <span id="profile_header_name">—</span>
                        <span id="profile_header_level">—</span>
                    </div>
                    <i class="fas fa-chevron-down"></i>
                    <div id="profile_header_dropdown">
                        <a href="/profile"><i class="fas fa-user"></i> Мой профиль</a>
                        <a href="/settings"><i class="fas fa-cog"></i> Настройки</a>
                        <div class="dropdown_divider"></div>
                        <a href="#" id="logout_btn"><i class="fas fa-right-from-bracket"></i> Выйти</a>
                    </div>
                </div>
            </div>
        </header>

        <section id="player_card">
            <div id="player_card_inner">
                <div id="avatar">
                    <img id="avatar_img" src="" alt="Аватар игрока">
                </div>
                <div id="player_info">
                    <div id="nickname">—</div>
                    <div id="tags"></div>
                    <div id="statistic"></div>
                </div>
            </div>
            <div id="progress_bar">
                <div id="progress_info">
                    <span id="progress_level">Уровень —</span>
                    <span id="progress_xp">— / — XP</span>
                </div>
                <div id="progress_track">
                    <div id="progress_fill"></div>
                </div>
            </div>
        </section>

        <div id="lower_panel">
            <ul id="tab_buttons">
                <li><button data-tab="stats"><i class="fas fa-chart-bar"></i> Статистика</button></li>
                <li><button data-tab="friends"><i class="fas fa-users"></i> Друзья</button></li>
                <li><button data-tab="skills"><i class="fas fa-crosshairs"></i> Навыки</button></li>
                <li><button data-tab="skinchanger"><i class="fas fa-wand-magic-sparkles"></i> Скинченджер</button></li>
                <li><button data-tab="activity"><i class="fas fa-chart-area"></i> Активность</button></li>
                <li><button data-tab="clan"><i class="fas fa-shield-halved"></i> Клан</button></li>
            </ul>
            <div id="tab_stats"       data-tab-content="stats"></div>
            <div id="tab_friends"     data-tab-content="friends"></div>
            <div id="tab_skills"      data-tab-content="skills"></div>
            <div id="tab_skinchanger" data-tab-content="skinchanger"></div>
            <div id="tab_activity"    data-tab-content="activity"></div>
            <div id="tab_clan"        data-tab-content="clan"></div>
        </div>
    </div>

    <div id="chat_panel"></div>

    <script src="../Actions/config.js"></script>
    <script src="../Actions/auth.js"></script>
    <script src="../Actions/headerAuth.js"></script>
    <script src="../Actions/profile.js"></script>
    <script>
        document.getElementById('steam_auth').addEventListener('click', steamLogin);
    </script>
</body>
</html>
