<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>First — Серверы</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="../Visual/Main.css">
</head>
<body>

    <aside id="left_sidebar">
        <div id="upper_logo">
            <div id="logo_text">FIRST<span>.</span></div>
        </div>
        <div id="game_selector"></div>
        <nav id="left_nav">
            <ul>
                <li id="nav_active"><i class="fas fa-server"></i><a href="#">Сервера</a></li>
                <li><i class="fas fa-wand-magic-sparkles"></i><a href="#">Скинченджер</a></li>
                <li><i class="fas fa-shield-halved"></i><a href="#">Клан</a></li>
                <li><i class="fas fa-users"></i><a href="#">Друзья</a></li>
                <li><i class="fas fa-gift"></i><a href="#">Кейсы</a></li>
                <li><i class="fas fa-store"></i><a href="#">Магазин</a></li>
                <li><i class="fas fa-trophy"></i><a href="#">Рейтинг</a></li>
            </ul>
        </nav>
        <div id="left_sidebar_bottom">
            <a href="#" id="settings_link"><i class="fas fa-cog"></i> Настройки</a>
            <div id="left_sidebar_user">
                <img id="left_sidebar_user_avatar" src="" alt="Аватар">
                <div id="left_sidebar_user_info">
                    <span id="left_sidebar_user_nickname">Player</span>
                    <span id="left_sidebar_user_level">Ур. 1</span>
                </div>
            </div>
        </div>
    </aside>

    <div id="main_content">
        <header id="upper_panel">
            <div id="upper_panel_left">
                <span id="page_title">Сервера</span>
                <span id="game_label"></span>
            </div>
            <div id="upper_panel_right">
                <div id="online_counter">
                    <span id="online_dot"></span>
                    <span id="online">0</span>
                    <span>онлайн</span>
                    <div id="online_breakdown">
                        <div id="breakdown_row_cs2"><span>CS2</span><span id="count_cs2">0</span></div>
                        <div id="breakdown_row_csgo"><span>CS:GO</span><span id="count_csgo">0</span></div>
                        <div id="breakdown_row_cssource"><span>CS:Source</span><span id="count_cssource">0</span></div>
                        <div id="breakdown_row_cs16"><span>CS 1.6</span><span id="count_cs16">0</span></div>
                    </div>
                </div>
                <button id="chat_btn">
                    <i class="fas fa-comment-dots"></i>
                    <span id="chat_badge">7</span>
                </button>
                <div id="notification_wrap">
                    <i class="fas fa-bell"></i>
                    <span id="notification"></span>
                </div>
                <div id="balance_wrap">
                    <i class="fas fa-gem"></i>
                    <span id="balance">0 ₽</span>
                </div>
                <button id="steam_auth" onclick="steamLogin()">
                    <i class="fab fa-steam"></i>
                    <span>Войти через Steam</span>
                </button>
            </div>
        </header>

        <section id="servers_section">
            <div id="servers_header">
                <div id="servers_title">Список <span id="servers_title_accent">серверов</span></div>
                <span id="servers_count">—</span>
            </div>
            <div id="servers_grid"></div>
        </section>
    </div>

    <div id="chat_panel"></div>

    <script src="../Actions/Main.js"></script>
</body>
</html>
