<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>First — Серверы</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="../Visual/main.css">
    <base target="_blank">
</head>
<body>
    <aside id="left_sidebar">
        <div id="upper_logo">
            <div id="logo_text">FIRST<span>.</span></div>
        </div>
        <div id="game_selector"></div>
        <nav id="left_nav">
            <ul>
                <li class="active"><i class="fas fa-server"></i><a href="#">Сервера</a></li>
                <li><i class="fas fa-wand-magic-sparkles"></i><a href="#">Скинченджер</a></li>
                <li><i class="fas fa-shield-halved"></i><a href="#">Клан</a></li>
                <li><i class="fas fa-users"></i><a href="#">Друзья</a></li>
                <li><i class="fas fa-gift"></i><a href="#">Кейсы</a></li>
                <li><i class="fas fa-store"></i><a href="#">Магазин</a></li>
                <li><i class="fas fa-trophy"></i><a href="#">Рейтинг</a></li>
            </ul>
        </nav>
        <div id="left_sidebar_bottom">
            <a href="#" id="settings_link"><i class="fas fa-cog"></i> Настройки</a>
            <div id="left_sidebar_user">
                <img id="left_sidebar_user_avatar" src="" alt="Аватар">
                <div id="left_sidebar_user_info">
                    <span id="left_sidebar_user_nickname">—</span>
                    <span id="left_sidebar_user_level">—</span>
                </div>
            </div>
        </div>
    </aside>

    <div id="main_content">
        <header id="upper_panel">
            <div id="upper_panel_left">
                <span id="page_title">Сервера</span>
                <span id="game_label"></span>
            </div>
            <div id="upper_panel_right">
                <div id="online_counter">
                    <span id="online_dot"></span>
                    <span id="online">—</span>
                    <span>онлайн</span>
                    <div id="online_breakdown">
                        <div class="breakdown-row" data-game="cs2"><span>CS2</span><span id="count_cs2" class="count">—</span></div>
                        <div class="breakdown-row" data-game="csgo"><span>CS:GO</span><span id="count_csgo" class="count">—</span></div>
                        <div class="breakdown-row" data-game="cssource"><span>CS:Source</span><span id="count_cssource" class="count">—</span></div>
                        <div class="breakdown-row" data-game="cs16"><span>CS 1.6</span><span id="count_cs16" class="count">—</span></div>
                    </div>
                </div>
                <button id="chat_btn"><i class="fas fa-comment-dots"></i><span id="chat_badge"></span></button>
                <div id="notification_wrap"><i class="fas fa-bell"></i><span id="notification"></span></div>
                <div id="balance_wrap" style="display:none;"><i class="fas fa-gem"></i><span id="balance">0 ₽</span></div>
                <button id="steam_auth"><i class="fab fa-steam"></i><span>Войти через Steam</span></button>
                <div id="profile_header_btn" style="display:none;">
                    <img id="profile_header_avatar" src="" alt="">
                    <div id="profile_header_info">
                        <span id="profile_header_name">—</span>
                        <span id="profile_header_level">—</span>
                    </div>
                    <i class="fas fa-chevron-down"></i>
                    <div id="profile_header_dropdown">
                        <a href="/profile"><i class="fas fa-user"></i> Мой профиль</a>
                        <a href="/settings"><i class="fas fa-cog"></i> Настройки</a>
                        <div class="dropdown_divider"></div>
                        <a href="#" id="logout_btn"><i class="fas fa-right-from-bracket"></i> Выйти</a>
                    </div>
                </div>
            </div>
        </header>

        <section id="servers_section">
            <div id="servers_header">
                <div id="servers_title">Список <span id="servers_title_accent">серверов</span></div>
                <span id="servers_count">—</span>
            </div>
            <div id="servers_grid"></div>
        </section>
    </div>

    <div id="chat_panel"></div>

    <script src="../Actions/config.js"></script>
    <script src="../Actions/auth.js"></script>
    <script src="../Actions/headerAuth.js"></script>
    <script src="../Actions/main.js"></script>
    <script>
        // Привязка кнопки Steam
        document.getElementById('steam_auth').addEventListener('click', steamLogin);
    </script>
</body>
</html>
