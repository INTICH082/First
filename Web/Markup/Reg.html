<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <link rel="stylesheet" href="../Visual/Reg.css">
</head>
<body>
    <form id="register-form" action="/register" method="POST">
        <div>
            <p>Ваш логин:</p>
            <input type = "text" minlength = "5" name = "login" placeholder = "Логин" required>
        </div>
        <div>
            <p>Ваша почта:</p>
            <input type = "email" minlength = "10" pattern = "^\S+@\S+\.\S+$" name = "email" placeholder = "Почта" required>
        </div>
        <div>
            <p>Ваш пароль:</p>
            <input type = "password" minlength = "10" name = "pass" placeholder = "Пароль" required>
        </div>
        <div>
            <p>Повторите пароль:</p>
            <input type = "password" minlength = "10" name = "repass" placeholder = "Повторите пароль" required>
        </div>
        <div>
            <button type = "submit">Зарегистрироваться</button>
        </div>
    </form>
</body>
</html>
