<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>First</title>
</head>
<body>
    <header class="site-header">

        <!-- Левая навигация -->

        <div class="header-left">
            <div id="logo">
                <p>First<span id="logodot">.</span></p>
            </div>
            <div id="game-selector" class="custom-select">
                <div class="select-trigger">
                    <span class="selected-text">CS 2</span>
                    <i class="fa-solid fa-chevron-down arrow-icon"></i>
                </div>
                <div class="custom-options">
                    <div class="option" data-value="cs2" style="background-image: url('../Elements/GameSelector/cs2.png');">
                        <div class="option-overlay">
                            <span>CS 2</span>
                        </div>
                    </div>
                    <div class="option" data-value="csgo" style="background-image: url('../Elements/GameSelector/csgo.png');">
                        <div class="option-overlay">
                            <span>CS:GO</span>
                        </div>
                    </div>
                    <div class="option" data-value="css" style="background-image: url('../Elements/GameSelector/cssource.png');">
                        <div class="option-overlay">
                            <span>CS: Source</span>
                        </div>
                    </div>
                    <div class="option" data-value="cs16" style="background-image: url('../Elements/GameSelector/cs16.png');">
                        <div class="option-overlay">
                            <span>CS 1.6</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Центральная навигация -->

        <nav class="main-nav" aria-label="Основная навигация">
            <ul>
                <li>
                    <a href="#" class="nav-link" aria-label="Играть"><i class="fa-solid fa-play"></i></a>
                </li>
                <li>
                    <a href="#" class="nav-link" aria-label="Магазин"><i class="fa-solid fa-cart-shopping"></i></a>
                </li>
                <li>
                    <a href="#" class="nav-link" aria-label="Турниры"><i class="fa-solid fa-trophy"></i></a>
                </li>
                <li>
                    <a href="#" class="nav-link" aria-label="Сообщество"><i class="fa-solid fa-users"></i></a>
                </li>
                <li>
                    <a href="#" class="nav-link" aria-label="Настройки"><i class="fa-solid fa-gear"></i></a>
                </li>
            </ul>
        </nav>

        <!-- Правая навигация -->

        <div class="header-right">
            <div class="online-widget" tabindex="0" role="button" aria-haspopup="true" aria-expanded="false">
                <span id="total-online">0</span>
                <div id="online-dropdown" class="dropdown-hidden">
                    <div class="dropdown-item"><span>CS 2</span><span class="online-count">0</span></div>
                    <div class="dropdown-item"><span>CS:GO</span><span class="online-count">0</span></div>
                    <div class="dropdown-item"><span>CS:S</span><span class="online-count">0</span></div>
                    <div class="dropdown-item"><span>CS 1.6</span><span class="online-count">0</span></div>
                </div>
            </div>

            <div id="balance" class="balance-widget">
                <span>0.00 ₽ <i class="fas fa-plus-circle"></i></span>
            </div>

            <div class="user-profile">
                <img src="https://via.placeholder.com/36" alt="Аватар" class="avatar">
                <span class="username">Player</span>
            </div>
        </div>
    </header>

    <hr class="header-divider">

    <!-- Уведомления и сообщения -->

    <div id="messages" class="icon-badge" role="button" tabindex="0" aria-label="Сообщения">
        <i class="fa-solid fa-message"></i>
        <span id="message-counter" class="badge">0</span>
    </div>

    <div id="notifications" class="icon-badge" role="button" tabindex="0" aria-label="Уведомления">
        <i class="fa-solid fa-bell"></i>
        <span id="notification-counter" class="badge">0</span>
    </div>

    <!-- Основная часть страницы -->
     
    <main class="site-content">
        <p>Сервера в разработке...</p>
    </main>

    <script src="common.js"></script>
</body>
</html>
